apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: authentik
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "authentik-secrets-role"
          # A dedicated SA (service-account.yaml), NOT the chart-created "authentik"
          # SA. That SA is created by the authentik HelmRelease itself, which is
          # blocked waiting on this SecretStore (via the ExternalSecret feeding
          # HelmRelease.valuesFrom) - pointing at it here would deadlock on first
          # apply. "authentik-vault" is a plain manifest applied independently of
          # the Helm chart, so it exists before the HelmRelease is even attempted.
          serviceAccountRef:
            name: "authentik-vault"
