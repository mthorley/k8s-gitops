# The pki-certman-letsencrypt component defaults the certificate hostname to
# "${APP}.${domain}" (i.e. pocketid.${domain}). Pocket ID is served on
# "auth.${domain}" - the host WebAuthn binds passkeys to - so override the
# dnsNames here rather than renaming APP, which also drives the Vault path,
# the ServiceAccount and the secrets role.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${APP}-tls-prod"
spec:
  dnsNames:
    - "auth.${domain}"
