apiVersion: batch/v1
kind: CronJob
metadata:
  name: tls-checker
  namespace: ccm
spec:
  # Once a day at 02:00 local. Deliberately not midnight: the influxdb,
  # home-assistant and node-red backups all run at 00:00 and are NFS-heavy, and
  # there is no reason to add to that window on a small cluster.
  schedule: "0 2 * * *"
  timeZone: "${cluster_tz}"
  concurrencyPolicy: Forbid
  # Wider than the 120s that suited the old 10-minute cadence: a missed daily
  # run is a 24h gap, so tolerate a longer controller/node blip before the
  # scheduler gives up on the run entirely.
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tls-checker
              image: mthorley/tls-scanner:latest
              imagePullPolicy: Always
              args:
                - "--endpoints-config"
                - "/etc/tls-checker/endpoints/endpoints.yaml"
                - "--policies-config"
                - "/etc/tls-checker/policies/policies.yaml"
              # Without these the SDK defaults to localhost:4317, so every
              # scheduled scan's spans are dropped ("Transient error
              # StatusCode.UNAVAILABLE ... localhost:4317") and nothing ever
              # reaches tls-graph-adapter or Neo4j. Mirrors deployment.yaml.
              env:
                - name: OTEL_SERVICE_NAME
                  value: tls-scanner
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector:4317
                - name: TLS_SCANNER_BACKEND
                  value: sslyze
              volumeMounts:
                - name: endpoints-config
                  mountPath: /etc/tls-checker/endpoints
                  readOnly: true
                - name: policies-config
                  mountPath: /etc/tls-checker/policies
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: endpoints-config
              configMap:
                name: tls-checker-endpoints
            - name: policies-config
              configMap:
                name: tls-checker-policies
