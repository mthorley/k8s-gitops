apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: authentik
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "authentik-secrets-role"
          # Static service-account-token Secret (service-account-token-secret.yaml),
          # not serviceAccountRef/TokenRequest - this ESO install doesn't support
          # that auth style (matches the secrets-eso-vault component's pattern used
          # by mongodb/monitoring/kagent/node-red/cloudflare).
          #
          # Bound to the dedicated "authentik-vault" SA (service-account.yaml), NOT
          # the chart-created "authentik" SA: that SA is created by the authentik
          # HelmRelease itself, which is blocked waiting on this SecretStore (via
          # the ExternalSecret feeding HelmRelease.valuesFrom) - pointing at it here
          # would deadlock on first apply. "authentik-vault" is a plain manifest
          # applied independently of the Helm chart, so it exists before the
          # HelmRelease is even attempted.
          secretRef:
            name: "authentik-vault"
            key: "token"
