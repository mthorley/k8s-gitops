# Config for the hass-oidc-auth custom component
# (christiaangoossens/hass-oidc-auth), mounted at /config/auth_oidc.yaml.
#
# configuration.yaml lives on the home-assistant-config PVC and is not in git,
# so it has to pull this in by hand, once:
#
#   auth_oidc: !include auth_oidc.yaml
#
# Only apps/staging references apps/common/homeassistant - production's copy of
# the line is commented out and production runs apps/production/ha-dev instead -
# so everything here applies to staging alone.
#
# There is no client secret to keep out of git: the Pocket ID client is a public
# client (PKCE), which is what this component defaults to and recommends. See
# the Home Assistant entry in setup/pocketid/config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-auth-oidc-config
data:
  auth_oidc.yaml: |
    client_id: home-assistant
    discovery_url: https://auth.${domain}/.well-known/openid-configuration

    # Shown as "Login with Pocket ID" on the welcome and login screens.
    display_name: Pocket ID

    # Pocket ID puts group names in the `groups` claim, which is the
    # component's default, so only the group names themselves need setting.
    roles:
      # Members of this group become Home Assistant administrators.
      admin: homeassistant-admins
      # Setting this makes the component reject anyone in neither group, so it
      # enforces the same restriction as the client's allowedGroups rather than
      # relying on Pocket ID alone.
      user: homeassistant

    features:
      # Adopts the existing Home Assistant account whose username matches the
      # Pocket ID preferred_username, instead of creating an empty second one.
      #
      # Turn this back off once everyone has signed in via Pocket ID at least
      # once: it means any Pocket ID user whose username matches a Home
      # Assistant user gets that account and its rights, and it bypasses any
      # MFA configured on it. Existing links keep working once it is off.
      automatic_user_linking: true
