# Exposes the dashboard (plain HTTP) on ccm.${domain} through envoy-gateway,
# same shape as torrent/node-red/adguard. The cert comes from the
# pki-certman-letsencrypt component, which issues ${APP}-tls-prod for
# ${APP}.${domain} via the Cloudflare DNS-01 solver.
#
# Note Neo4j's Bolt port cannot be served this way - it is raw TCP and would
# need TCPRoute/TLSRoute from the experimental Gateway API channel, hence the
# separate MetalLB Service in loadbalancer.yaml.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: ccm-gateway
  namespace: ccm
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "ccm.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: ccm-dashboard
  namespace: ccm
spec:
  parentRefs:
    - name: ccm-gateway
  hostnames:
    - "ccm.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Explicit, rather than inheriting the gateway default, to leave headroom
      # for large graph queries.
      timeouts:
        request: 30s
      backendRefs:
        - name: ccm-dashboard
          port: 8080
