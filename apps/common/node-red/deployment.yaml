apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: node-red
  labels:
    app: node-red
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      serviceAccountName: nodered
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-red
        # mirrored into each cluster's own zot (infrastructure/common/zot) from
        # docker.io/mthorley/node-red with `crane copy`, so the two clusters do
        # not depend on each other or on docker hub at pod start. ${domain}
        # resolves per cluster, so each pulls locally.
        #image: mthorley/node-red:70c3567104b5fd73cde156249157f4f848bbe0ab
        image: zot.${domain}/node-red:173acf81507b5b87a32f85320214af2c3eb28fd2
        # the tag is immutable (a git sha), so no need to re-pull every start;
        # IfNotPresent also means a registry outage cannot stop a pod restart
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1880
          name: node-red-ui
        securityContext:
          privileged: true
        volumeMounts:
        - name: node-red-data
          mountPath: /data
        # Mounted over the settings.js that otherwise lives on the PVC, so the
        # Pocket ID adminAuth config comes from git. subPath keeps the rest of
        # /data (flows, credentials, node_modules) on the volume. Read-only, and
        # Node-RED never writes settings.js - it writes .config.*.json instead.
        - name: node-red-settings
          mountPath: /data/settings.js
          subPath: settings.js
          readOnly: true
        env:
        - name: HUE_BRIDGE_IP
          value: 192.168.1.191
        - name: HUE_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: hue-token
        - name: NODE_RED_ENABLE_PROJECTS
          value: "true"
        - name: MQTT_IP
          value: "${mqtt_ip}"
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: mqtt-password
        - name: SONOS_DININGROOM_R_IP
          value: 192.168.1.31
        - name: SONOS_DININGROOM_R
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: sonos-diningroom-r
        - name: SONOS_DININGROOM_L_IP
          value: 192.168.1.26
        - name: SONOS_DININGROOM_L
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: sonos-diningroom-l
        - name: SONOS_WHISKYROOM_L
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: sonos-whiskyroom-l
        - name: SONOS_WHISKYROOM_R
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: sonos-whiskyroom-r
        - name: UNIFI_USER
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: unifi-user
        - name: UNIFI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: unifi-password
        - name: ZEN_WIFI_USER
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: zen-wifi-user
        - name: ZEN_WIFI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: zen-wifi-password
        # Read by the passport-openidconnect strategy in settings.js. The
        # Pocket ID OIDC client is created by hand in each cluster's Pocket ID
        # admin UI (it has no terraform provider); its id/secret are then stored
        # in Vault at secret/nodered by setup/vault/kv2.tf.
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: oidc-client-id
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: secret-nodered
              key: oidc-client-secret
        - name: TZ
          value: "${cluster_tz}"
      volumes:
      - name: node-red-data
        persistentVolumeClaim:
          claimName: node-red-claim
      # name is rewritten to the hashed name by the configMapGenerator in
      # kustomization.yaml
      - name: node-red-settings
        configMap:
          name: node-red-settings
