# Populated by the k8s service-account-token controller once the "authentik-vault"
# SA (service-account.yaml) exists - matches the pattern in
# components/secrets-eso-vault/service-account-token-secret.yaml, used since this
# ESO install doesn't support serviceAccountRef/TokenRequest auth.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-vault
  namespace: authentik
  annotations:
    kubernetes.io/service-account.name: "authentik-vault"
type: kubernetes.io/service-account-token
