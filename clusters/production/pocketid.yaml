# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocketid
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/common/pocket-id
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      # Drives the Vault path (secret/pocketid), the secrets role, the
      # ServiceAccount name and the Certificate name. It does NOT drive the
      # hostname - cert-hostname-patch.yaml pins that to auth.${domain}.
      APP: "pocketid"
      ACME_EMAIL: "matt.thorley@gmail.com"
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
