# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
    # gvisor RuntimeClass + mutating policy that sandboxes the pod
    - name: agent-sandbox
  interval: 30m0s
  path: ./apps/common/hermes
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      # Drives the Vault paths (secret/hermes, secret/hermes-cf-api-token), the secrets
      # role, the ServiceAccount, the Certificate name and the Gateway/host.
      APP: "hermes"
      ACME_EMAIL: "matt.thorley@gmail.com"
      # components/gateway-envoy backend
      GATEWAY_SERVICE: "hermes"
      GATEWAY_PORT: "9119"
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
