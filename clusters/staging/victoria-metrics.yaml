apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 30m0s
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/common/victoria-metrics
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "victoria-metrics"
      ACME_EMAIL: "matt.thorley@gmail.com"
