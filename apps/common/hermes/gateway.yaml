# Dashboard on hermes.${domain}. The cert comes from the pki-certman-letsencrypt
# component (named ${APP}-tls-prod, i.e. hermes-tls-prod). Dashboard basic auth guards access.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: hermes-gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "hermes.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  parentRefs:
    - name: hermes-gateway
  hostnames:
    - "hermes.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes
          port: 9119
