apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m0s
  dependsOn:
    # vault + external-secrets (cf token), cert-manager, nfs storage class,
    # ingress-nginx, and the vault-backend SecretStore in monitoring
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/staging/monitoring
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "grafana"
      ACME_EMAIL: "matt.thorley@gmail.com"
