# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-metrics
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - gateway.yaml
  - grafana-datasource.yaml

components:
  - ../../../components/secrets-eso-vault
  - ../../../components/pki-certman-letsencrypt

# Same as adguard: no app-level secret in Vault (only the cf-api-token), so the
# generic external-secret-${APP} from secrets-eso-vault has nothing to sync and
# sits in SecretSyncedError. Keep the component - its SecretStore and token
# Secret back the cf-api-token ExternalSecret - and drop just this resource.
patches:
  - target:
      kind: ExternalSecret
      name: ^external-secret-\$\{APP\}$
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: external-secret-${APP}
