# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Built by clusters/staging/homeassistant.yaml (APP=homeassistant), not by the
# apps/staging bundle - the cert and SecretStore components below are keyed on
# ${APP}. Production does not build this at all; it runs apps/production/ha-dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - home-assistant-stack.yaml
  - gateway.yaml
  - backup-cron.yaml
  - lb.yaml
  - allow-local-egress-unifi-netpol.yaml
  - allow-local-egress-dns-netpol.yaml
  - allow-ext-egress-netpol.yaml
  - allow-ext-egress-components-netpol.yaml
  - deny-all-egress-netpol.yaml

# configuration.yaml is Home Assistant's own config, version controlled rather
# than left on the PVC. The generated name carries a content hash, which
# changes the pod spec and rolls Home Assistant whenever the file changes -
# same approach as node-red's settings.js. Without it the ConfigMap would update
# silently and the subPath mount in the running pod would keep the old file.
configMapGenerator:
  - name: home-assistant-configuration
    files:
      - configuration.yaml

components:
  # Provides the SecretStore and service-account token Secret that the
  # *-cf-api-token ExternalSecret below depends on.
  - ../../../components/secrets-eso-vault
  # Issues homeassistant.${domain} from Let's Encrypt via the Cloudflare
  # DNS-01 solver, as secret ${APP}-tls-prod for gateway.yaml.
  - ../../../components/pki-certman-letsencrypt

# Home Assistant keeps its own secrets on the config PVC and its Pocket ID
# client is public (no secret), so the generic external-secret-${APP} from
# secrets-eso-vault has nothing to sync and would sit in SecretSyncedError
# forever. Drop just that resource and keep the rest of the component, the
# same way adguard and zot do.
patches:
  - target:
      kind: ExternalSecret
      name: ^external-secret-\$\{APP\}$
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: external-secret-${APP}
