# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jupyter
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/production/jupyter
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "jupyter"
      ACME_EMAIL: "matt.thorley@gmail.com"
      # components/gateway-envoy backend
      GATEWAY_SERVICE: "jupyter-internal"
      GATEWAY_PORT: "80"
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: jupyter
  wait: false
