# LAN-only on nextcloud.${domain} through envoy-gateway, same shape as
# node-red. The cert comes from the pki-certman-letsencrypt component, which
# names it ${APP}-tls-prod and defaults its dnsNames to ${APP}.${domain}.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: nextcloud-gateway
  namespace: nextcloud
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "nextcloud.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: nextcloud-gateway
  hostnames:
    - "nextcloud.${domain}"
  rules:
    # iOS and DAVx5 look up /.well-known/caldav and /.well-known/carddav at the
    # host root. Nextcloud's .htaccess answers those itself with a 301 to
    # /remote.php/dav, so no rewrite is needed here - but it builds the
    # Location from OVERWRITEPROTOCOL, which is why that is set to https.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nextcloud-internal
          port: 80
