# Nightly pg_dump to the QNAP, alongside the data-volume tarball from
# components/backup-cron-nfs. Calendars, contacts, shares and file metadata
# all live in this database, so it is the half of the backup that matters most
# for the family calendar.
#
# Needs qnap_ip and cluster_id substituted by clusters/<env>/nextcloud.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-postgres-backup
  namespace: nextcloud
spec:
  schedule: "15 1 * * *"
  timeZone: "${cluster_tz}"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          # netpol/allow-ingress-postgres.yaml lets this label in
          labels:
            app: nextcloud-postgres-backup
        spec:
          containers:
          - name: pg-dump
            image: zot.${domain}/postgres:18.6-alpine3.23
            imagePullPolicy: IfNotPresent
            env:
            - name: PGHOST
              value: nextcloud-postgres
            # The superuser from POSTGRES_USER. The installer creates its own
            # oc_admin role for Nextcloud to connect as, but this one can dump
            # everything.
            - name: PGUSER
              value: nextcloud
            - name: PGDATABASE
              value: nextcloud
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-nextcloud
                  key: postgres-password
            command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /backup/nextcloud-db
              DATE="$(date +%Y%m%d_%H%M%S)"
              # Custom format: compressed, and restorable table by table with pg_restore.
              pg_dump -Fc -f "/backup/nextcloud-db/nextcloud_$DATE.dump.tmp"
              mv "/backup/nextcloud-db/nextcloud_$DATE.dump.tmp" "/backup/nextcloud-db/nextcloud_$DATE.dump"
              cd /backup/nextcloud-db && ls -1t nextcloud_*.dump | tail -n +15 | xargs -r rm -f
            volumeMounts:
            - name: nfs-volume
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: nfs-volume
            nfs:
              server: "${qnap_ip}"
              path: "/k8s/backup/${cluster_id}"
