# Sets runtimeClassName: gvisor at creation on pods that are either:
#   - labelled sandbox.gvisor=true (kagent agents opt in via spec.declarative.deployment.labels,
#     as the Agent CRD has no runtimeClassName field), or
#   - in a namespace labelled sandbox.gvisor=true (e.g. kagent-sandbox, so agents created
#     from the kagent UI are sandboxed without needing labels)
# Selection is done by the two bindings; a pod matching both is mutated to the same value.
# Alpha on 1.33 - kube-apiserver needs --feature-gates=MutatingAdmissionPolicy=true
# and --runtime-config=admissionregistration.k8s.io/v1alpha1=true
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicy
metadata:
  name: gvisor-runtimeclass
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  failurePolicy: Fail
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              runtimeClassName: "gvisor"
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gvisor-runtimeclass
spec:
  policyName: gvisor-runtimeclass
  matchResources:
    objectSelector:
      matchLabels:
        sandbox.gvisor: "true"
---
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gvisor-runtimeclass-namespace
spec:
  policyName: gvisor-runtimeclass
  matchResources:
    namespaceSelector:
      matchLabels:
        sandbox.gvisor: "true"
