apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      serviceAccountName: torrent
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "512Mi"
          env:
           - name: PUID
             value: "65534"
           - name: PGID
             value: "65534"
           - name: TZ
             value: "${cluster_tz}"
           - name: WEBUI_PORT
             value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: nfs-volume
              mountPath: /nas
          ports:
            - name: torrent-ui
              containerPort: 8080          # qBittorrent Web UI
              protocol: TCP
          # Set qBittorrent to use Gluetun's DNS to ensure all traffic is routed via VPN
          dnsPolicy: None
          dnsConfig:
            nameservers:
            - 127.0.0.1                   # Gluetun's DNS resolver inside the Pod
        - name: gluetun
          image: qmcgaw/gluetun
          resources:
            limits:
              memory: "1Gi"
            requests:
              memory: "512Mi"
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "expressvpn"
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: secret-torrent
                  key: username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-torrent
                  key: password
            - name: SERVER_COUNTRIES
              value: "Singapore"
            - name: TZ
              value: "${cluster_tz}"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
          securityContext:
              capabilities:
                add: ["NET_ADMIN"]
          volumeMounts:
            - name: vpn-config
              mountPath: /config
      volumes:
        - name: vpn-config
          persistentVolumeClaim:
            claimName: vpn-config-claim
        - name: config
          persistentVolumeClaim:
            claimName: torrent-config-claim
        - name: downloads
          persistentVolumeClaim:
            claimName: torrent-download-claim
        - name: nfs-volume
          nfs:
            server: "${qnap_ip}"
            path: "/k8s/torrents"
