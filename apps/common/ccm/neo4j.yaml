apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ccm
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: ccm
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # The Service below is named "neo4j", so Kubernetes injects service-link
      # env vars like NEO4J_PORT_7687_TCP_PORT into this pod. The neo4j
      # entrypoint turns every NEO4J_* env var into a config setting, yielding
      # the bogus "PORT.7687.TCP.PORT" and failing strict validation. Neo4j
      # resolves everything via DNS, so drop the injected links entirely.
      enableServiceLinks: false
      # Run as the image's own neo4j user (uid/gid 7474). The entrypoint only
      # chowns /data when it is running as root, and NFS root_squash denies
      # that chown ("Operation not permitted" on /data/dbms), so running
      # non-root skips it. The nfs-subdir provisioner creates volume dirs
      # 0777, so 7474 can still write.
      securityContext:
        runAsUser: 7474
        runAsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: secret-ccm
                  key: auth
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "managed-nfs-storage"
        resources:
          requests:
            storage: 10Gi
