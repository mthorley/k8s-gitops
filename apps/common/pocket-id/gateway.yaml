# Serves the IdP on auth.${domain} through envoy-gateway, same shape as
# node-red/ccm. The cert comes from the pki-certman-letsencrypt component,
# which names it ${APP}-tls-prod; cert-hostname-patch.yaml retargets its
# dnsNames from the component default (pocketid.${domain}) to auth.${domain}.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: pocketid-gateway
  namespace: pocket-id
spec:
  gatewayClassName: envoy
  # externalTrafficPolicy: Cluster - see envoyproxy.yaml
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: pocketid-proxy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "auth.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: pocketid
  namespace: pocket-id
spec:
  parentRefs:
    - name: pocketid-gateway
  hostnames:
    - "auth.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pocketid-internal
          port: 80
