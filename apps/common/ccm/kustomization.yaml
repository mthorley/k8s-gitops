# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ccm
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - tls-scanner
  - neo4j.yaml
  - loadbalancer.yaml
  - ccm-dashboard.yaml

components:
  - ../../../components/secrets-eso-vault
  - ../../../components/pki-certman-letsencrypt
  - ../../../components/gateway-envoy

patches:
  # Explicit, rather than inheriting the gateway default, to leave headroom
  # for large graph queries.
  - target:
      kind: HTTPRoute
    patch: |
      - op: add
        path: /spec/rules/0/timeouts
        value: {"request": "30s"}
