# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: windmill
  namespace: flux-system
spec:
  dependsOn:
    # vault + external-secrets, cert-manager, nfs storage class
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/common/windmill
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      # Drives the Vault paths (secret/windmill, secret/windmill-cf-api-token), the
      # secrets role, the ServiceAccount, the Certificate name and the Gateway/host.
      APP: "windmill"
      ACME_EMAIL: "matt.thorley@gmail.com"
      # components/gateway-envoy backend
      GATEWAY_SERVICE: "windmill-app"
      GATEWAY_PORT: "8000"
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
