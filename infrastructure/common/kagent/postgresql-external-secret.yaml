# Overrides the chart-hardcoded Secret/kagent-postgresql (see
# postgresql-secret.yaml stripped from kagent-stack.yaml at render time).
# Same name/key the chart's postgresql.yaml and controller-deployment.yaml
# templates already reference, so no chart changes are needed downstream --
# this just supplies the value from Vault instead of the chart's baked-in
# "kagent" literal.
#
# Password itself lives in Vault at secret/kagent (key: postgres-password),
# set via setup/vault/kv2.tf (TF var KAGENT_POSTGRES_PASSWORD) -- run
# `terraform apply` there first or this ExternalSecret has nothing to pull.
#
# Note: Postgres only reads POSTGRES_PASSWORD on first initdb. Rotating the
# value in Vault later updates this Secret but does NOT change the running
# database's actual password, and nothing here auto-restarts the postgres
# pod (its checksum/secret annotation is baked in at helm-template time
# against the chart's static value, not this live Secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-postgresql
  namespace: kagent
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: kagent-postgresql
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/kagent
        property: postgres-password
