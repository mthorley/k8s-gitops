# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/production/adguard
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "adguard"
      ACME_EMAIL: "matt.thorley@gmail.com"
      adguard_web_ip: 192.168.2.16
      adguard_dns_ip: 192.168.2.17
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: adguard-home
  wait: false
