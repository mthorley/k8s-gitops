# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard-home
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - services.yaml
  - gateway.yaml

components:
  - ../../../components/secrets-eso-vault
  - ../../../components/pki-certman-letsencrypt

# AdGuard Home has no app-level secret data to pull, so the generic
# external-secret-${APP} from secrets-eso-vault has nothing to sync and just
# sits in SecretSyncedError. That component also provides the SecretStore
# and service-account token Secret the working *-cf-api-token ExternalSecret
# depends on, so drop just this one unused resource rather than the whole
# component.
patches:
  - target:
      kind: ExternalSecret
      name: ^external-secret-\$\{APP\}$
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: external-secret-${APP}
