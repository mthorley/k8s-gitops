# Exposes grafana, prometheus and alertmanager through envoy-gateway on one
# Gateway (one LoadBalancer IP), same shape as victoria-metrics. The cert
# ${APP}-tls-prod comes from the pki-certman-letsencrypt component and covers
# all three hostnames (see the Certificate patch in kustomization.yaml).
# external-dns (unifi-dns, source gateway-httproute) creates the A records.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: monitoring-gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: grafana
      protocol: HTTPS
      port: 443
      hostname: "grafana.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
    - name: prometheus
      protocol: HTTPS
      port: 443
      hostname: "prometheus.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
    - name: alertmanager
      protocol: HTTPS
      port: 443
      hostname: "alertmanager.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "${APP}-tls-prod"
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: monitoring-gateway
      sectionName: grafana
  hostnames:
    - "grafana.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs:
    - name: monitoring-gateway
      sectionName: prometheus
  hostnames:
    - "prometheus.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: monitoring-gateway
      sectionName: alertmanager
  hostnames:
    - "alertmanager.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
