# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ccm
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/production/ccm
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "ccm"
      # Used by the pki-certman-letsencrypt component's ACME Issuer.
      ACME_EMAIL: "matt.thorley@gmail.com"
      # Bolt + Browser UI for Neo4j Desktop (apps/common/ccm/loadbalancer.yaml).
      # Free in the MetalLB pool (192.168.2.10-40): .21-.25, .27, .33-.40 are
      # unused, and .22/.23/.30/.32 are earmarked in apps.yaml for
      # crypto-automation/unifi/zigbee2mqtt/frigate.
      neo4j_ip: 192.168.2.21
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ccm
  wait: false
