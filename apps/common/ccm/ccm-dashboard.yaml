apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccm-dashboard
  namespace: ccm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccm-dashboard
  template:
    metadata:
      labels:
        app: ccm-dashboard
    spec:
      # A Service named "neo4j" exists in this namespace, so Kubernetes would
      # inject NEO4J_PORT=tcp://<ip>:7687, NEO4J_SERVICE_HOST etc. into this
      # pod. Harmless unless the app reads one of those names, which is easy to
      # do by accident when it already takes NEO4J_* config - same class of
      # problem that crash-looped neo4j itself (see neo4j.yaml).
      enableServiceLinks: false
      containers:
        - name: ccm-dashboard
          image: mthorley/ccm-dashboard:latest
          # :latest, so Always - IfNotPresent means a rebuilt image is never
          # picked up, even across a pod delete (matches the other workloads).
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: secret-ccm
                  key: username
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-ccm
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # 100m CFS-throttled query rendering badly: ~2.3s for 200 rows
              # against a Neo4j that answers the same query in ~0.19s from a
              # laptop. Request stays low - the load is spiky and interactive,
              # so bursting headroom is what matters, not reserved capacity.
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ccm-dashboard
  namespace: ccm
spec:
  selector:
    app: ccm-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
