# Default-deny egress for everything in kagent-sandbox, except what a kagent agent needs:
#   - DNS (kube-dns) - also feeds Cilium's DNS proxy so toFQDNs can resolve
#   - kagent-controller:8083 - A2A / task store / session (KAGENT_URL)
#   - api.anthropic.com:443 - model provider (default-model-config)
# Agents using MCP tools hosted elsewhere (e.g. kagent-tools in kagent) need an extra rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-egress
  namespace: kagent-sandbox
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kagent
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: controller
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
