# metallb controller + speakers expose prometheus metrics on the "monitoring"
# container port. A PodMonitor needs no Service in metallb-system (which this
# kustomization's namespace override could not express anyway) and, unlike
# the old ServiceMonitor, also covers the speakers.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: metallb
  labels:
    app: metallb
spec:
  jobLabel: component
  namespaceSelector:
    matchNames:
      - metallb-system
  selector:
    matchLabels:
      app: metallb
  podMetricsEndpoints:
    - port: monitoring
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
