apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-secret-authentik
  namespace: authentik
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: authentik-secret
  dataFrom:
  - extract:
      key: secret/authentik
