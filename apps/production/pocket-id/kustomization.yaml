# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id

# Production-only overlay: the common base plus the nightly PVC backup. Staging
# runs apps/common/pocket-id directly and is not backed up.
resources:
  - ../../common/pocket-id

components:
  - ../../../components/backup-cron-nfs
