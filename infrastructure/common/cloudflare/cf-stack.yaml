---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2 # You could also consider elastic scaling for this deployment
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflare
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.7.3
        args:
        - tunnel
        # Points cloudflared to the config file, which configures what
        # cloudflared will actually do. This file is created by a ConfigMap
        # below.
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        # Hardening: the image already ships a built-in "nonroot" user
        # (uid/gid 65532, confirmed via the image config on Docker Hub) and
        # declares no writable volumes, so it doesn't need root or a
        # writable root filesystem to run `tunnel run` against a static
        # config + credentials file. no-autoupdate is set in the ConfigMap
        # below, so there's nothing that needs to write back to disk at
        # runtime.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            # Cloudflared has a /ready endpoint which returns 200 if and only if
            # it has an active connection to the edge.
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        # Each tunnel has an associated "credentials file" which authorizes machines
        # to run the tunnel. cloudflared will read this file from its local filesystem,
        # and it'll be stored in a k8s secret.
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          # Populated by the secrets-eso-vault component from Vault path
          # secret/cloudflare, key "creds" (var.CLOUDFLARE_TUNNEL in
          # setup/vault/kv2.tf) -- remapped here to the credentials.json
          # filename cloudflared expects.
          secretName: secret-cloudflare
          items:
          - key: creds
            path: credentials.json
      # Create a config.yaml file from the ConfigMap below.
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
---
# This ConfigMap is just a way to define the cloudflared config.yaml file in k8s.
# It's useful to define it in k8s, rather than as a stand-alone .yaml file, because
# this lets you use various k8s templating solutions (e.g. Helm charts) to
# parameterize your config, instead of just using string literals.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    # Tunnel ID for the "home-assistant" tunnel (`cloudflared tunnel list`).
    # Its credentials.json must be stored in Vault at secret/cloudflare,
    # key "creds" (var.CLOUDFLARE_TUNNEL in setup/vault/kv2.tf).
    tunnel: c7504fee-674f-47e4-9f01-89e28ac56354
    credentials-file: /etc/cloudflared/creds/credentials.json
    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    # Autoupdates applied in a k8s pod will be lost when the pod is removed or restarted, so
    # autoupdate doesn't make sense in Kubernetes. However, outside of Kubernetes, we strongly
    # recommend using autoupdate.
    no-autoupdate: true
    # Default ("auto") prefers QUIC over UDP for the edge connection. Forced
    # to http2 (TCP) because one replica was observed repeatedly failing to
    # hold its QUIC connection ("control stream encountered a failure while
    # serving", then the same on a second connIndex against a different edge
    # IP) for hours at a stretch, while its sibling replica on a different
    # node stayed clean the whole time -- consistent with UDP/QUIC being
    # unreliable somewhere on that node's path to Cloudflare's edge, not an
    # application or Cloudflare-side problem. http2-over-TCP avoids that.
    protocol: http2
    # The `ingress` block tells cloudflared which local service to route incoming
    # requests to. For more about ingress rules, see
    # https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/configuration/ingress
    #
    # Remember, these rules route traffic from cloudflared to a local service. To route traffic
    # from the internet to cloudflared, run:
    # `cloudflared tunnel route dns c7504fee-674f-47e4-9f01-89e28ac56354 <ha_fqdn>`.
    #
    # NOTE: deliberately a dedicated FQDN one level under the zone apex (${ha_fqdn}),
    # not ha.${domain} (two levels under the apex). Cloudflare's free Universal SSL
    # only covers the zone apex + one level of wildcard, not two levels deep, so a
    # hostname under ${domain} has no edge certificate and fails TLS handshake.
    ingress:
    # Home Assistant lives in the `homeassistant` namespace; cloudflared runs in
    # `cloudflare`, so it must be addressed via its fully-qualified in-cluster DNS name.
    - hostname: "${ha_fqdn}"
      service: http://home-assistant.homeassistant.svc.cluster.local:8123
    # This rule matches any traffic which didn't match a previous rule, and responds with HTTP 404.
    - service: http_status:404
---
# Exposes cloudflared's built-in Prometheus metrics endpoint (metrics: 0.0.0.0:2000
# above) so it can be scraped -- see the ServiceMonitor below.
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  labels:
    app: cloudflared
spec:
  selector:
    app: cloudflared
  ports:
  - name: metrics
    port: 2000
    targetPort: 2000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared-servicemonitor
spec:
  # Derive the `job` label from the Service's `app` label (-> "cloudflared")
  # instead of the default (the Service's own name, "cloudflared-metrics").
  # Community Grafana dashboards for cloudflared expect job="cloudflared".
  jobLabel: app
  selector:
    matchLabels:
      app: cloudflared
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
