# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production monitoring, reconciled by the "monitoring" flux Kustomization
# (clusters/production/monitoring.yaml, which supplies APP/ACME_EMAIL):
# monitoring-system (kube-prometheus-stack: operator, prometheus, alertmanager,
# grafana, kube-state-metrics, node-exporter, rules, dashboards, datasources,
# gateway + letsencrypt cert). Identical to the staging composition.
resources:
  - ../../common/monitoring-system
