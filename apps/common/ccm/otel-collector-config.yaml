apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-scanner-otel
  namespace: ccm
data:
  otel-collector.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/file_storage

    receivers:
      otlp:
        protocols:
          # Must be explicit. Since collector v0.110 the OTLP receiver
          # defaults to localhost, not 0.0.0.0, so leaving these empty makes
          # the collector reachable only from inside its own pod — every
          # sender gets "connection refused" on otel-collector:4317 and all
          # spans are silently lost.
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      debug:
        verbosity: basic
      # No Tempo is deployed in this cluster, so the otlp/tempo exporter that
      # upstream ships is omitted: it could never resolve ("lookup tempo ...
      # no such host") and, with retry_on_failure plus a persistent queue,
      # would slowly fill the 1Gi file_storage PVC with undeliverable spans.
      # Re-add it (and put it back in the traces pipeline) if Tempo lands.
      otlphttp/graph-adapter:
        endpoint: http://tls-graph-adapter:4318
        # tls-graph-adapter parses request.body() as protobuf directly and
        # ignores Content-Encoding, so the otlphttp default of gzip makes every
        # export fail with a protobuf DecodeError surfaced as HTTP 500 (the
        # collector then logs "Permanent error ... HTTP Status Code 500" and
        # drops the batch). Traffic is in-cluster and tiny, so sending
        # uncompressed costs nothing. Remove this once the adapter gunzips.
        compression: none
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          storage: file_storage

    service:
      extensions: [file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp/graph-adapter]
