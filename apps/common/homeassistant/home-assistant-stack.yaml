---
# Source: home-assistant/templates/common.yaml
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: home-assistant-config
  labels:
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/version: 2022.5.4
    helm.sh/chart: home-assistant-13.4.2
  annotations:
    volume.beta.kubernetes.io/storage-class: "managed-nfs-storage"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
# Source: home-assistant/templates/common.yaml
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/version: 2022.5.4
    helm.sh/chart: home-assistant-13.4.2
  annotations:
spec:
  type: ClusterIP
  ports:
  - port: 8123
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
---
# Source: home-assistant/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/instance: home-assistant
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/version: 2022.5.4
    helm.sh/chart: home-assistant-13.4.2
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/instance: home-assistant
    spec:
      
      # Not `default`: the secrets-eso-vault SecretStore authenticates to Vault
      # as this service account - see serviceaccount.yaml.
      serviceAccountName: homeassistant
      automountServiceAccountToken: true
#      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: home-assistant
          # Ahead of apps/production/ha-dev (2026.8.3) - staging went to 2026.10 for a
          # (since removed) dashboard trial and stays there; it cannot go back anyway.
          # Bumped from the chart's 2022.5.4 originally because hass-oidc-auth needs
          # 2025.11+ (setup/homeassistant/README.md). The recorder schema migration on
          # first start is one-way - going back means restoring the home-assistant-config PVC.
          image: "ghcr.io/home-assistant/home-assistant:2026.10.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: null
          env:
            - name: "TZ"
              value: "${cluster_tz}"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            # Shadows the configuration.yaml onboarding writes to the PVC.
            # subPath so only that one file is replaced and the rest of the
            # volume (.storage, the DB, automations.yaml) stays writable.
            # Carries the http: and auth_oidc: config inline - see
            # configuration.yaml in this directory.
            - name: ha-configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            # Git-managed theme(s), picked up by frontend: themes:
            # !include_dir_merge_named themes. A directory mount (not subPath) so
            # edits refresh in the running pod; Reload themes applies them.
            - name: ha-theme-parchment
              mountPath: /config/themes/parchment
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: ha-configuration
          configMap:
            name: home-assistant-configuration
        - name: ha-theme-parchment
          configMap:
            name: home-assistant-theme-parchment
