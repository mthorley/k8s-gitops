# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ccm
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  interval: 30m0s
  path: ./apps/production/ccm
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "ccm"
      # Used by the pki-certman-letsencrypt component's ACME Issuer.
      ACME_EMAIL: "matt.thorley@gmail.com"
      # Bolt + Browser UI for Neo4j Desktop (apps/common/ccm/loadbalancer.yaml).
      # Check apps.yaml before reusing: some pool addresses are earmarked there
      # for apps that are currently commented out.
      neo4j_ip: 192.168.2.21
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ccm
  wait: false
