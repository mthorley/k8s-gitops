# Nous Research Hermes Agent: Telegram gateway (foreground) plus the web dashboard
# (s6-supervised, HERMES_DASHBOARD=1). The sandbox.gvisor=true pod label opts it into
# infrastructure/common/agent-sandbox/gvisor-mutating-policy.yaml, which sets
# runtimeClassName: gvisor at admission (scheduled onto sandbox.gvisor=true workers).
# Starts as root on purpose: s6-overlay /init must be PID 1 and remaps/chowns before
# dropping to the hermes user - don't set runAsUser.
# Model provider is auto-detected from ANTHROPIC_API_KEY; pick the model in the dashboard
# (persisted to /opt/data/config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO data volume
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        sandbox.gvisor: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v2026.9.24
          args: ["gateway", "run"]
          env:
            - name: TZ
              value: "${cluster_tz}"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: hermes
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-hermes
                  key: dashboard-password
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-hermes
                  key: anthropic-apikey
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret-hermes
                  key: telegram-bot-token
            # Gateway is default-deny; comma-separated numeric Telegram user IDs.
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: secret-hermes
                  key: telegram-allowed-users
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
