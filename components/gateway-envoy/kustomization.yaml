# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Standard envoy-gateway exposure for one app: an HTTPS Gateway on
# ${APP}.${domain} (cert ${APP}-tls-prod from pki-certman-letsencrypt or pki-certman-vault) and an
# HTTPRoute sending everything to one Service.
#
# Needs these Flux postBuild substitutions on the app's Kustomization:
#   APP              names the Gateway (${APP}-gateway), the route, the host and the cert
#   domain           from the cluster-vars Secret (substituteFrom)
#   GATEWAY_SERVICE  backend Service name
#   GATEWAY_PORT     backend Service port (number)
#
# Per-app differences (timeouts, extra listeners) go in a patch in the app's
# kustomization; apps whose shape differs (pocket-id, monitoring) keep their own.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - gateway.yaml
