# Mounted at /config/http.yaml and pulled in by configuration.yaml on the PVC:
#
#   http: !include http.yaml
#
# Required now that traffic arrives through envoy-gateway rather than only on
# the LoadBalancer IP. Without it Home Assistant sees the gateway pod as the
# client, rejects the X-Forwarded-For header, and hass-oidc-auth builds its
# redirect URI from the wrong scheme and host - so every login fails.
#
# Same file as apps/production/ha-dev/http-config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-http-config
data:
  http.yaml: |
    use_x_forwarded_for: true
    trusted_proxies:
      - 10.0.0.0/8
