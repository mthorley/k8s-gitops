# Stable service names from the old kube-prometheus manifests, pointed at the
# chart's pods. Keeps the grafana datasource (prometheus-k8s.monitoring.svc),
# prometheus-adapter --prometheus-url and the ingress-* objects working
# without touching them.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-k8s
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prometheus-stack-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-main
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: kube-prometheus-stack-alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: 9093
