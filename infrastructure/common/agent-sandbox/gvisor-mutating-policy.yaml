# Sets runtimeClassName: gvisor on any pod labelled sandbox.gvisor=true at creation.
# Lets kagent agents (whose CRD has no runtimeClassName field) opt in via
# spec.declarative.deployment.labels.
# Alpha on 1.33 - kube-apiserver needs --feature-gates=MutatingAdmissionPolicy=true
# and --runtime-config=admissionregistration.k8s.io/v1alpha1=true
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicy
metadata:
  name: gvisor-runtimeclass
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: opted-in
      expression: "object.metadata.?labels[?'sandbox.gvisor'].orValue('') == 'true'"
  failurePolicy: Fail
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              runtimeClassName: "gvisor"
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1alpha1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gvisor-runtimeclass
spec:
  policyName: gvisor-runtimeclass
