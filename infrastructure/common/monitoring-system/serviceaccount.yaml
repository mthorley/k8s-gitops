# Vault auth identity for the secrets-eso-vault component (bound to
# grafana-secrets-role in setup/vault/grafana-kv2.tf), which provides the
# SecretStore the letsencrypt component's Cloudflare-token ExternalSecret
# uses. Not the SA grafana runs as - the chart creates its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}
