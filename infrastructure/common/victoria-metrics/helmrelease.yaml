apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chart:
    spec:
      chart: victoria-metrics-single
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      version: "0.46.0"
  interval: 1h0m0s
  values:
    server:
      # months unless a unit suffix is given
      retentionPeriod: 12
      persistentVolume:
        enabled: true
        storageClassName: managed-nfs-storage
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      # scraped by the prometheus-operator in monitoring ns
      serviceMonitor:
        enabled: true
      # exposed via envoy-gateway, see gateway.yaml
      ingress:
        enabled: false
