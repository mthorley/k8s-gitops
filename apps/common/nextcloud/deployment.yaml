apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  # Both volumes are RWO and the entrypoint rsyncs into /var/www/html on a
  # version bump - two pods doing that at once would corrupt the install.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      serviceAccountName: nextcloud
      securityContext:
        # www-data. The image normally starts as root and chowns its volumes,
        # which NFS root_squash turns into permission errors. Started as 33 it
        # skips the chown and runs everything - rsync, occ, apache - as 33.
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Apache listens on :80, which a non-root process may only bind with
        # this (a namespaced, kubelet-safe sysctl).
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      initContainers:
      # The installer gives up after a few retries if Postgres is not up yet,
      # leaving a half-written config.php behind - so hold it back instead.
      - name: wait-for-postgres
        image: zot.${domain}/postgres:18.6-alpine3.23
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        # -U is required: without it pg_isready takes the OS user name, and uid
        # 33 has no passwd entry here, so it exits 3 ("no attempt") forever.
        - until pg_isready -h nextcloud-postgres -p 5432 -U nextcloud; do sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      # With REDIS_HOST set, the entrypoint writes redis-session.ini into
      # PHP's conf.d, which only root can write. Seed a writable copy of the
      # image's conf.d (opcache, apcu, memory limits, ...) for it to land in.
      - name: php-conf
        image: zot.${domain}/nextcloud:34.0.4-apache
        imagePullPolicy: IfNotPresent
        # Plain cp of the files: -a would also try to stamp the emptyDir root,
        # which is owned by root, and fail.
        command: ["sh", "-c", "cp /usr/local/etc/php/conf.d/*.ini /php-conf.d/"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: php-conf
          mountPath: /php-conf.d
      containers:
      - name: nextcloud
        image: zot.${domain}/nextcloud:34.0.4-apache
        # pinned to an exact release - Nextcloud only upgrades one major at a
        # time, so a floating tag that skips a major leaves it unable to start
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        # Database - only read by the installer on first start. Afterwards the
        # connection details live in config.php.
        - name: POSTGRES_HOST
          value: nextcloud-postgres
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nextcloud
              key: postgres-password
        # Initial admin, created by the installer. Changing it in Vault later
        # does nothing - change it in the web UI or with `occ user:resetpassword`.
        - name: NEXTCLOUD_ADMIN_USER
          value: admin
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nextcloud
              key: admin-password
        # Outside the webroot, on its own volume. A subdirectory, so Nextcloud
        # creates it itself as uid 33 and can set the 0770 it insists on - it
        # cannot chmod the provisioner-owned volume root.
        - name: NEXTCLOUD_DATA_DIR
          value: /var/www/nextcloud-data/data
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: "nextcloud.${domain}"
        # TLS terminates at the envoy Gateway. Trust X-Forwarded-* from pod IPs
        # (Cilium cluster-pool 10.0.0.0/8) and always build https:// URLs, or
        # CalDAV discovery and login redirects come back as http://.
        - name: TRUSTED_PROXIES
          value: "10.0.0.0/8"
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: "https://nextcloud.${domain}"
        # Valkey for file locking and the distributed cache. Transactional
        # locking in the database is slow on a Pi; this is the documented fix.
        - name: REDIS_HOST
          value: nextcloud-valkey
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nextcloud
              key: valkey-password
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: PHP_UPLOAD_LIMIT
          value: 1G
        - name: TZ
          value: "${cluster_tz}"
        volumeMounts:
        - name: html
          mountPath: /var/www/html
        - name: data
          mountPath: /var/www/nextcloud-data
        - name: hooks
          mountPath: /docker-entrypoint-hooks.d/post-installation
        - name: php-conf
          mountPath: /usr/local/etc/php/conf.d
        # First start rsyncs ~600MB of PHP onto NFS and runs the installer,
        # which takes several minutes on a Pi - hence the long startup window.
        #
        # status.php answers 400 to any Host that is not in trusted_domains, and
        # the kubelet would otherwise send the pod IP - hence the Host header.
        startupProbe:
          httpGet:
            path: /status.php
            port: http
            httpHeaders:
            - name: Host
              value: "nextcloud.${domain}"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /status.php
            port: http
            httpHeaders:
            - name: Host
              value: "nextcloud.${domain}"
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /status.php
            port: http
            httpHeaders:
            - name: Host
              value: "nextcloud.${domain}"
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      # Background jobs (calendar reminders, trash and version expiry, ...).
      # The image's own cron.sh runs busybox crond, which needs root to switch
      # to www-data, so this loop replaces it. The post-installation hook
      # switches Nextcloud to "Cron" background mode to match.
      - name: cron
        image: zot.${domain}/nextcloud:34.0.4-apache
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            # Nothing to run until the main container has finished installing.
            if [ -f /var/www/html/config/config.php ]; then
              php -f /var/www/html/cron.php
            fi
            sleep 300
          done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        # config/redis.config.php reads these at runtime, so without them
        # background jobs would lock files in the database while the web
        # container locks them in Valkey.
        - name: REDIS_HOST
          value: nextcloud-valkey
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-nextcloud
              key: valkey-password
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: TZ
          value: "${cluster_tz}"
        volumeMounts:
        - name: html
          mountPath: /var/www/html
        - name: data
          mountPath: /var/www/nextcloud-data
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi
      volumes:
      - name: html
        persistentVolumeClaim:
          claimName: nextcloud-html
      - name: data
        persistentVolumeClaim:
          claimName: nextcloud-data
      - name: hooks
        configMap:
          name: nextcloud-hooks
          defaultMode: 0755
      - name: php-conf
        emptyDir: {}
