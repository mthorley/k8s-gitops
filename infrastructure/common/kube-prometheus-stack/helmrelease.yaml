apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: "91.4.1"
  interval: 1h0m0s
  # the pis are slow to pull the operator/prometheus/alertmanager images
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    # keep the monitoring.coreos.com CRDs in lockstep with the chart
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    grafana:
      enabled: true
      defaultDashboardsTimezone: browser
      # fresh instance on its own PVC; the pre-chart grafana's sqlite
      # (grafana-storage) is left to be decommissioned. Everything grafana
      # needs is provisioned (sidecar dashboards/datasources) or applied by
      # terraform (setup/monitoring), so there is nothing to migrate.
      persistence:
        enabled: true
        storageClassName: managed-nfs-storage
        size: 5Gi
      initChownData:
        # NFS
        enabled: false
      testFramework:
        enabled: false
      # exposed via envoy-gateway, see gateway.yaml (no chart ingresses)
      grafana.ini:
        server:
          root_url: https://grafana.${domain}
        auth.anonymous:
          enabled: false
        # carried over from the old vault-templated grafana.ini; no smtp-server
        # service exists yet so this is inert until one does
        smtp:
          enabled: true
          host: smtp-server.monitoring.svc:25
          from_address: myemail@gmail.com
          from_name: Grafana Alert
          skip_verify: true
      sidecar:
        # any ConfigMap labelled grafana_dashboard=1 / grafana_datasource=1 in
        # any namespace is provisioned, so apps ship their own next to their
        # manifests (see dashboards/ here, victoria-metrics/grafana-datasource)
        dashboards:
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
        datasources:
          searchNamespace: ALL
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 300Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.${domain}
        scrapeInterval: 30s
        retention: 7d
        # hard cap so the WAL/TSDB can't balloon on the unquota'd NFS share;
        # whichever of retention/retentionSize hits first wins
        retentionSize: 8GB
        # pick up every ServiceMonitor/PodMonitor/PrometheusRule/Probe in the
        # cluster, not just the chart's own (vault, metallb, victoria-metrics,
        # grafana...)
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            # the previous instance grew to 1.9Gi with no limit and a 400Mi
            # request; OOM-restart is preferable to swapping the node
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: managed-nfs-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.${domain}
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            memory: 150Mi
        # persist silences/notification log across restarts
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: managed-nfs-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 200Mi

    nodeExporter:
      # only ship the linux node dashboards
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    prometheus-node-exporter:
      # no cpu limit: the old daemonset had 250m and CPUThrottlingHigh fired
      # on every node
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 100Mi
      prometheus:
        monitor:
          # instance=<node name> instead of <pod ip>:9100, as the old
          # kube-prometheus manifests did; dashboards/alerts read better and
          # the label survives pod restarts
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance

    # kubeadm control plane: the chart's Services select the static pods by
    # their component=kube-controller-manager|kube-scheduler|etcd labels, and as
    # they are hostNetwork the endpoints resolve to the node IP(s) without
    # listing them here. The pods bind 127.0.0.1 by default; the node needs
    # --bind-address=0.0.0.0 (controller-manager, scheduler) and
    # --listen-metrics-urls=http://127.0.0.1:2381,http://<node ip>:2381 (etcd;
    # not 0.0.0.0, that double-binds the port and etcd crash-loops) in
    # /etc/kubernetes/manifests or these targets stay down. See README.

    # kube-proxy metrics bind 127.0.0.1:10249 and cilium is the intended
    # replacement, so don't scrape it (would only produce KubeProxyDown)
    kubeProxy:
      enabled: false
