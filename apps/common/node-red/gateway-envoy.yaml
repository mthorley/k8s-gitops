# Envoy Gateway test route, parallel to gateway.yaml's nginx-fronted one.
# Same backend, different hostname/GatewayClass -- safe to delete this file
# (and its kustomization.yaml entry) to back the test out without touching
# the existing nginx path.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: nodered-gateway-envoy
  namespace: node-red
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "nodered-envoy.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nodered-envoy-tls-prod
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: nodered-envoy
  namespace: node-red
spec:
  parentRefs:
    - name: nodered-gateway-envoy
  hostnames:
    - "nodered-envoy.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nodered-internal
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nodered-envoy-tls-prod
  namespace: node-red
spec:
  secretName: nodered-envoy-tls-prod
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  dnsNames:
    - "nodered-envoy.${domain}"
