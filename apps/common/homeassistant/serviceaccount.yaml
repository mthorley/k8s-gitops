# The secrets-eso-vault component authenticates to Vault as this service
# account (role homeassistant-secrets-role, see setup/vault/homeassistant-kv2.tf)
# to fetch the Cloudflare DNS token the ACME DNS-01 challenge needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeassistant
  namespace: homeassistant
