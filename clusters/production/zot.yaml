apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 30m0s
  dependsOn:
    # vault + external-secrets (cf token), cert-manager, nfs storage class
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/common/zot
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      APP: "zot"
      ACME_EMAIL: "matt.thorley@gmail.com"
