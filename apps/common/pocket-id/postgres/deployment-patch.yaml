apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  template:
    spec:
      # Pocket ID exits if the database is unreachable at start, so hold it
      # back until Postgres answers rather than crash-looping through its boot.
      initContainers:
      - name: wait-for-postgres
        image: docker.io/library/postgres:18.6-alpine3.23
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - until pg_isready -h pocket-id-postgres -p 5432; do sleep 2; done
        securityContext:
          runAsUser: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: pocket-id
        env:
        # Pocket ID picks Postgres for any postgres:// URL. The full URL is built
        # by setup/vault (password URL-encoded there) so no shell or $(VAR)
        # expansion is needed here.
        - name: DB_CONNECTION_STRING
          value: null
          valueFrom:
            secretKeyRef:
              name: secret-pocketid
              key: db-connection-string
