# Builds the DATABASE_URL the app and workers read (windmill.databaseUrlSecretName) from
# the same Vault password the chart's Postgres is initialised with (helmrelease.yaml
# valuesFrom). The password goes into the URL as-is, so keep it URL-safe (alphanumeric).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: windmill-database
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: windmill-database
    template:
      engineVersion: v2
      data:
        url: "postgres://postgres:{{ .password }}@windmill-postgresql:5432/windmill?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: secret/windmill
        property: postgres-password
