# Staging only: adds VictoriaMetrics as a Grafana datasource alongside the
# common prometheus one. Uses the stock prometheus datasource type (VM speaks
# the Prometheus HTTP API), so no plugin install is needed. Decode with
#   yq .data.\"datasources.yaml\" grafana-datasources-patch.yaml | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
  namespace: monitoring
type: Opaque
data:
  datasources.yaml: 
