# Named "pocketid" rather than "pocket-id" because components/secrets-eso-vault
# binds the Vault Kubernetes auth role to a ServiceAccount called "${APP}" and
# annotates a token Secret of the same name onto it - so this name must match
# the APP substitution in clusters/staging/pocketid.yaml exactly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocketid
  labels:
    app: pocket-id
