# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: gateway-api-crds
    - name: envoy-gateway
    # every image is pulled from zot.${domain} - see apps/common/nextcloud/README.md
    - name: zot
  interval: 30m0s
  path: ./apps/common/nextcloud
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
    substitute:
      # Drives the Vault path (secret/nextcloud), the secrets role, the
      # ServiceAccount name, the cert name and the hostname nextcloud.${domain}.
      APP: "nextcloud"
      ACME_EMAIL: "matt.thorley@gmail.com"
      # Both backup CronJobs write to <qnap>:/k8s/backup/${cluster_id}, the
      # same share pocketid.yaml backs up to.
      qnap_ip: 192.168.1.147
      cluster_id: cluster1
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
